# Helm Values Configuration for DevOps App
replicaCount: 2

image:
  repository: vaibhavibobde/my-app
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: false